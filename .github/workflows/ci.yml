name: ci

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/gen-check.mjs

  test:
    needs: contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit -p tsconfig.json
      - run: node --test test/*.test.ts

  runtimes:
    needs: contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, deno]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: oven-sh/setup-bun@v2
        if: matrix.runtime == 'bun'
      - uses: denoland/setup-deno@v2
        if: matrix.runtime == 'deno'
        with:
          deno-version: v2.x
      - run: node scripts/build.mjs
      - name: import the built package
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            bun run scripts/runtime-smoke.mjs
          else
            deno run --allow-read --allow-env scripts/runtime-smoke.mjs
          fi

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build.mjs
      - run: npm pack --pack-destination /tmp/pack
      - name: install the packed tarball into a clean project
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke
          npm init -y
          npm install /tmp/pack/*.tgz
          cp "$GITHUB_WORKSPACE/scripts/install-smoke.mjs" .
          cp "$GITHUB_WORKSPACE/scripts/install-smoke.cjs" .
          node install-smoke.mjs
          node install-smoke.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: /tmp/pack/*.tgz
